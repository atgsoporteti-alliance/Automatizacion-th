services:
  postgres:
    image: postgres:16-alpine
    container_name: alliance-hcm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alliance_hcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alliance_hcm_secret}
      POSTGRES_DB: ${POSTGRES_DB:-alliance_hcm_db}
    ports:
      - "5432:5432"
    volumes:
      - alliance_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alliance_hcm} -d ${POSTGRES_DB:-alliance_hcm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alliance-hcm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - alliance_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: alliance-hcm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - alliance_minio_data:/data

volumes:
  alliance_pg_data:
  alliance_redis_data:
  alliance_minio_data:
